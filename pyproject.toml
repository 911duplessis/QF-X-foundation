[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qf-x-foundation"
version = "0.1.0"
description = "Research-first market-state, opportunity, risk and validation platform"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
research = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "scikit-learn>=1.4", "pyarrow>=14"]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
